<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
  <!-- instance boundary -->
  <rect x="24" y="56" width="840" height="470" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="44" y="88" font-size="17" font-weight="600" fill="#475569">Instance (one server deployment)</text>
  <!-- platform store -->
  <rect x="520" y="76" width="320" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="540" y="108" font-size="14" font-weight="600" fill="#1e293b">Platform users · license · config</text>
  <text x="540" y="132" font-size="13" fill="#64748b">PostgreSQL platform database</text>
  <!-- project box -->
  <rect x="52" y="126" width="430" height="270" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="72" y="158" font-size="16" font-weight="700" fill="#1d4ed8">Project docs-demo</text>
  <!-- assets -->
  <rect x="76" y="180" width="382" height="86" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="96" y="210" font-size="14" font-weight="600" fill="#334155">Assets: scripts · workflows · resources</text>
  <text x="96" y="234" font-size="13" fill="#64748b">Editable drafts; test runs have real side effects</text>
  <!-- endpoint tree -->
  <rect x="76" y="286" width="382" height="86" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="96" y="316" font-size="14" font-weight="600" fill="#334155">Endpoint tree (draft)</text>
  <text x="96" y="340" font-size="13" fill="#64748b">POST /hello → script hello · authorizer anonymous</text>
  <!-- publish arrow -->
  <path d="M 482 261 C 560 261 580 261 648 261" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="540" y="248" font-size="14" font-weight="600" fill="#475569">publish</text>
  <text x="530" y="282" font-size="12" fill="#94a3b8">captures a snapshot</text>
  <!-- snapshot -->
  <rect x="652" y="200" width="188" height="122" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="672" y="232" font-size="14" font-weight="700" fill="#1d4ed8">Published snapshot</text>
  <text x="672" y="258" font-size="13" fill="#475569">The route contract</text>
  <text x="672" y="278" font-size="13" fill="#475569">served to callers</text>
  <text x="672" y="304" font-size="12" fill="#94a3b8">Editing drafts does not change it</text>
  <!-- who manages -->
  <text x="52" y="436" font-size="13" fill="#64748b">Platform users (console / CLI) edit drafts; project Owner/Admin publishes</text>
  <!-- callers -->
  <rect x="908" y="170" width="264" height="182" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="928" y="202" font-size="15" font-weight="700" fill="#1e293b">External callers</text>
  <text x="928" y="230" font-size="13" fill="#64748b">End users · machines · API keys</text>
  <text x="928" y="252" font-size="13" fill="#64748b">No console login</text>
  <rect x="928" y="272" width="224" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="944" y="294" font-size="13" fill="#334155">POST /p/docs-demo/hello</text>
  <text x="944" y="312" font-size="12" fill="#94a3b8">Public project URL prefix</text>
  <path d="M 908 261 L 844 261" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- auth plane note -->
  <rect x="908" y="384" width="264" height="128" rx="12" fill="#fffbeb" stroke="#d97706"/>
  <text x="928" y="414" font-size="13" font-weight="600" fill="#92400e">Authentication ≠ authorization</text>
  <text x="928" y="438" font-size="12" fill="#92400e">Authorizers answer "who is calling"</text>
  <text x="928" y="458" font-size="12" fill="#92400e">Authz gates answer "may they call"</text>
  <text x="928" y="478" font-size="12" fill="#92400e">Both inherit along the tree</text>
  <text x="928" y="498" font-size="12" fill="#92400e">See the concepts page</text>
</svg>
