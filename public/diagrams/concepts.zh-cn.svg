<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
  <!-- instance boundary -->
  <rect x="24" y="56" width="840" height="470" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="44" y="88" font-size="17" font-weight="600" fill="#475569">实例（一套服务端部署）</text>
  <!-- platform store -->
  <rect x="520" y="76" width="320" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="540" y="108" font-size="14" font-weight="600" fill="#1e293b">平台账号 · 许可 · 配置</text>
  <text x="540" y="132" font-size="13" fill="#64748b">PostgreSQL 平台库</text>
  <!-- project box -->
  <rect x="52" y="126" width="430" height="270" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="72" y="158" font-size="16" font-weight="700" fill="#1d4ed8">项目 docs-demo</text>
  <!-- assets -->
  <rect x="76" y="180" width="382" height="86" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="96" y="210" font-size="14" font-weight="600" fill="#334155">资产：脚本 · 工作流 · 资源</text>
  <text x="96" y="234" font-size="13" fill="#64748b">可编辑的草稿；测试运行会产生真实副作用</text>
  <!-- endpoint tree -->
  <rect x="76" y="286" width="382" height="86" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="96" y="316" font-size="14" font-weight="600" fill="#334155">端点树（草稿）</text>
  <text x="96" y="340" font-size="13" fill="#64748b">POST /hello → 脚本 hello · 认证器 anonymous</text>
  <!-- publish arrow -->
  <path d="M 482 261 C 560 261 580 261 648 261" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="536" y="248" font-size="14" font-weight="600" fill="#475569">发布</text>
  <text x="536" y="282" font-size="12" fill="#94a3b8">生成快照</text>
  <!-- snapshot -->
  <rect x="652" y="200" width="188" height="122" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="672" y="232" font-size="14" font-weight="700" fill="#1d4ed8">已发布快照</text>
  <text x="672" y="258" font-size="13" fill="#475569">对外分发的</text>
  <text x="672" y="278" font-size="13" fill="#475569">路由契约与目标</text>
  <text x="672" y="304" font-size="12" fill="#94a3b8">编辑草稿不影响已发布版本</text>
  <!-- who manages -->
  <text x="52" y="436" font-size="13" fill="#64748b">平台用户（控制台 / CLI）编辑草稿，项目 Owner/Admin 发布</text>
  <!-- callers -->
  <rect x="908" y="170" width="264" height="182" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="928" y="202" font-size="15" font-weight="700" fill="#1e293b">外部调用方</text>
  <text x="928" y="230" font-size="13" fill="#64748b">终端用户 · 机器 · API key</text>
  <text x="928" y="252" font-size="13" fill="#64748b">不登录控制台</text>
  <rect x="928" y="272" width="224" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="944" y="294" font-size="13" fill="#334155">POST /p/docs-demo/hello</text>
  <text x="944" y="312" font-size="12" fill="#94a3b8">项目对外 URL 前缀</text>
  <path d="M 908 261 L 844 261" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- auth plane note -->
  <rect x="908" y="384" width="264" height="128" rx="12" fill="#fffbeb" stroke="#d97706"/>
  <text x="928" y="414" font-size="13" font-weight="600" fill="#92400e">认证 ≠ 授权</text>
  <text x="928" y="438" font-size="12" fill="#92400e">认证器回答"调用者是谁"</text>
  <text x="928" y="458" font-size="12" fill="#92400e">授权门禁回答"能否调用"</text>
  <text x="928" y="478" font-size="12" fill="#92400e">两者沿端点树继承</text>
  <text x="928" y="498" font-size="12" fill="#92400e">规则见概念页</text>
</svg>
